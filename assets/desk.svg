@keyframes r3{0%{transform:translateX(0);animation-timing-function:steps(27)}12%,100%{transform:translateX(210.6px)}}
@keyframes bl{50%{opacity:0}}
@keyframes sm{0%{opacity:0;transform:translateY(4px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-7px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}40%{opacity:1}100%{opacity:0;transform:translate(7px,-14px)}}
@keyframes tw{50%{transform:rotate(12deg)}}
@keyframes gl{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.t1{opacity:1}.cv{display:none}.sm,.z{opacity:.5}.gl{opacity:.8}}
</style>
