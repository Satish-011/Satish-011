.z{opacity:0;animation:zz 3.2s ease-in infinite}
.z2{animation-delay:1.4s}
.tl{transform-box:fill-box;transform-origin:0 100%;animation:tw 3s ease-in-out infinite}
.gl{animation:gl 4s ease-in-out infinite}
@keyframes v{0%,30%{opacity:1}32%,100%{opacity:0}}
@keyframes r1{0%{transform:translateX(0);animation-timing-function:steps(20)}12%,100%{transform:translateX(156px)}}
